<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NYCU E3 Helper</title>
  <link rel="stylesheet" href="../Style.css">
  <script src="../Script.js" defer></script>
</head>
<body>
  <main>
    <img src="../Icon.png" width="80" height="80" alt="NYCU E3 Helper">
    <h1>NYCU E3 Helper</h1>
    <p data-zh="在 Safari 集中查看 E3 作業、課程、公告與教材。" data-en="Your E3 assignments, courses, announcements and materials in Safari.">在 Safari 集中查看 E3 作業、課程、公告與教材。</p>
    <p class="state-unknown" role="status" data-zh="請到 Safari 設定 → 延伸功能，啟用 NYCU E3 Helper。" data-en="Enable NYCU E3 Helper in Safari Settings → Extensions.">請到 Safari 設定 → 延伸功能，啟用 NYCU E3 Helper。</p>
    <p class="state-on" role="status" data-zh="延伸功能已啟用。請登入 E3，允許網站存取，再點頁面右側入口。" data-en="Extension enabled. Sign in to E3, allow website access, then open the helper on the right edge.">延伸功能已啟用。請登入 E3，允許網站存取，再點頁面右側入口。</p>
    <p class="state-off" role="status" data-zh="延伸功能尚未啟用。請開啟 Safari 設定完成啟用。" data-en="Extension disabled. Open Safari Settings to enable it.">延伸功能尚未啟用。請開啟 Safari 設定完成啟用。</p>
    <div class="actions">
      <button class="open-preferences" data-zh="開啟 Safari 延伸功能設定" data-en="Open Safari Extension Settings">開啟 Safari 延伸功能設定</button>
      <button class="open-e3" data-zh="開啟 E3" data-en="Open E3">開啟 E3</button>
    </div>
    <p class="detail" data-zh="Safari 版支援側欄通知與 macOS 原生桌面通知，可在通知設定啟用並測試。分開下載使用 Safari 的下載或預覽流程；也可在 E3 頁面打包 ZIP。" data-en="Safari supports sidebar alerts and native macOS notifications. Enable and test them in notification settings. Individual files use Safari downloads or previews; ZIP is also available on E3 pages.">Safari 版支援側欄通知與 macOS 原生桌面通知，可在通知設定啟用並測試。分開下載使用 Safari 的下載或預覽流程；也可在 E3 頁面打包 ZIP。</p>
    <p class="detail" data-zh="資料儲存在本機。使用翻譯或 AI 摘要時，相關內容會傳送至 Google 或 OpenAI。本工具非學校官方服務。" data-en="Data is stored locally. Translation and AI summaries send relevant content to Google or OpenAI. This is an unofficial tool.">資料儲存在本機。使用翻譯或 AI 摘要時，相關內容會傳送至 Google 或 OpenAI。本工具非學校官方服務。</p>
  </main>
</body>
</html>
